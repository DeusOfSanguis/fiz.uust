<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Check out my outdoor activity with Pacer</title>
  <meta property="og:title" content="Walking 6.8 km with Pacer">
</head>
<body>
  <div id="app">
    <header class="share-header">
      <img src="https://cdn.pacer.cc/share/img/pacer_logo.c1c6c4b4.png" alt="Pacer">
      <span>Pacer Pedometer &amp; Step Tracker</span>
      <button>Install</button>
    </header>
    <div class="track-card">
      <img class="avatar" src="https://cdn.pacer.cc/websource/assets/07_01.png" alt="">
      <div class="user-name">Vyacheslav Dmitriev (Des Hade)</div>
      <img class="activity-icon" src="https://cdn.pacer.cc/share/track/icon_gps_track_type_walk_gray.png" alt="">
      <div class="activity-type">Walking Activity</div>
      <div class="distance-block">
        <span class="num">6.8</span>
        <span class="unit">km</span>
      </div>
      <div class="start-time">Oct 20, 2026 7:37 AM</div>
      <section class="metrics">
        <div class="metric"><span class="label">Avg.Pace</span><span class="value">26&rsquo;06&rsquo;&rsquo;</span></div>
        <div class="metric"><span class="label">Speed(km/h)</span><span class="value">2.3</span></div>
        <div class="metric"><span class="label">Time</span><span class="value">2:56:34</span></div>
        <div class="metric"><span class="label">Calories</span><span class="value">768</span></div>
        <div class="metric"><span class="label">Steps</span><span class="value">5115</span></div>
        <div class="metric"><span class="label">Elev Gain(m)</span><span class="value">305</span></div>
        <div class="metric"><span class="label">Cadence</span><span class="value">29</span><span class="unit">/min</span></div>
      </section>
      <section class="splits">
        <h3>Splits</h3>
        <table>
          <thead><tr><th>KM</th><th>Pace</th><th>Elevation</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>11&rsquo;30&rsquo;&rsquo;</td><td>-1m</td></tr>
            <tr><td>2</td><td>104&rsquo;44&rsquo;&rsquo;</td><td>14m</td></tr>
            <tr><td>3</td><td>26&rsquo;14&rsquo;&rsquo;</td><td>2m</td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </div>
  <script>window.__DATA__ = {"distance": 6.8, "time": 10594};</script>
</body>
</html>
